<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Music Player</title>
  </head>
  <body>
    <header>
      <!-- <h1>Music Player</h1> -->
    </header>

    <main>
      <section id="player-section">
        <div>
          <h2>Select a track from your library</h2>
          <input type="file" id="input-file" accept="audio/*" />
        </div>

        <div class="separator"></div>

        <div id="example-tracks">
          <h2>Or Select one from the example tracks:</h2>
          <small
            >Royalty-Free Example Tracks from
            <a
              href="https://pixabay.com/music/search/no%20copyright%20music/"
              target="_blank"
              class="pixabay-link"
              >pixabay</a
            ></small
          >
          <br />
          <ul id="example-tracks-list"></ul>
        </div>
      </section>

      <section id="controls" class="controls">
        <div class="control">
          <button id="playback-toggle" disabled>Play</button>
          <button id="control-stop">Stop</button>
        </div>

        <div class="track-time-data">
          <h2 id="track-name">---</h2>
          <span id="track-currenttime">0:00</span>
          /
          <span id="track-duration">0:00</span>
        </div>

        <div class="player-extra-config">
          <input
            type="range"
            id="volumen-input"
            min="0.00"
            max="1.00"
            step="0.01"
            value="0.50"
          />
          <button>Repeat</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
